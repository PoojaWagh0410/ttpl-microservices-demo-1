server:
  port: 8081

spring:
  application:
    name: student-service

  cloud:
    loadbalancer:
      retry:
        enabled: true

  datasource:
    url: jdbc:mysql://mysql:3306/college_student_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Root@1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

springdoc:
  api-docs:
    path: /student/v3/api-docs
  swagger-ui:
    path: /student/swagger-ui/index.html

logging:
  level:
    org.springframework.security: INFO
